<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LABVIBHARAM — Clinical Excellence</title>
    <meta name="description" content="Clinical Laboratory Operations & Management Suite" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
    <script>
      // Ensure trailing slash on GitHub Pages directory paths so relative assets './assets/*' resolve accurately
      if (
        window.location.pathname &&
        !window.location.pathname.endsWith('/') &&
        !window.location.pathname.split('/').pop().includes('.')
      ) {
        window.location.replace(
          window.location.pathname + '/' + window.location.search + window.location.hash
        );
      }
    </script>
  </head>
  <body class="bg-[#FDFCFB] text-[#2D2D2D] font-sans antialiased selection:bg-[#828E7D] selection:text-[#FFFFFF] min-h-screen">
    <div id="root">
      <div class="initial-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#334155;padding:24px;">
        <div style="background:#ffffff;padding:28px;border-radius:24px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);border:1px solid #E2E8F0;text-align:center;max-width:420px;width:100%;">
          <div style="width:44px;height:44px;background:#EFF6FF;color:#2563EB;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px;font-weight:bold;">
            🏥
          </div>
          <h2 style="font-size:16px;font-weight:700;color:#0F172A;margin:0 0 6px 0;">LABVIBHARAM</h2>
          <p id="loader-subtext" style="font-size:12px;color:#64748B;line-height:1.4;margin:0 0 14px 0;">
            Loading clinical laboratory suite...
          </p>
          <div style="width:100%;background:#F1F5F9;height:4px;border-radius:999px;overflow:hidden;margin-bottom:8px;">
            <div style="width:50%;background:#2563EB;height:100%;border-radius:999px;animation:pulse 1s infinite;"></div>
          </div>

          <!-- Fallback prompt if static asset loading fails or hangs -->
          <div id="loader-fallback-prompt" style="display:none;text-align:left;background:#FFFBEB;border:1px solid #FCD34D;border-radius:14px;padding:12px;margin-top:14px;font-size:11px;color:#92400E;">
            <div style="font-weight:bold;margin-bottom:4px;">
              ⚠️ Loading took longer than usual
            </div>
            <p style="margin:0 0 8px 0;line-height:1.4;">
              If this is your first time loading on GitHub Pages, try refreshing or opening the /docs/ folder if deployed there.
            </p>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button onclick="window.location.reload()" style="padding:6px 12px;background:#2563EB;color:#ffffff;border:none;border-radius:999px;font-weight:bold;font-size:11px;cursor:pointer;">
                Reload
              </button>
              <a href="./docs/" style="display:inline-block;padding:6px 12px;background:#ffffff;border:1px solid #D1D5DB;color:#374151;border-radius:999px;font-weight:bold;text-decoration:none;font-size:11px;">
                Open /docs/
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Fallback: If root still contains .initial-loader after 5 seconds, reveal retry option
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.querySelector('.initial-loader')) {
          var fallback = document.getElementById('loader-fallback-prompt');
          if (fallback) fallback.style.display = 'block';
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
