<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LABVIBHARAM — Clinical Excellence</title>
    <meta name="description" content="Clinical Laboratory Operations & Management Suite" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      // Ensure trailing slash on GitHub Pages directory paths so relative assets './assets/*' resolve accurately
      if (
        window.location.pathname &&
        !window.location.pathname.endsWith('/') &&
        !window.location.pathname.split('/').pop().includes('.')
      ) {
        window.location.replace(
          window.location.pathname + '/' + window.location.search + window.location.hash
        );
      }
    </script>
    <script type="module" crossorigin src="./assets/index-CHiBSHKN.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CGtS2MDT.css">
  </head>
  <body class="bg-[#FDFCFB] text-[#2D2D2D] font-sans antialiased selection:bg-[#828E7D] selection:text-[#FFFFFF] min-h-screen">
    <div id="root">
      <div class="initial-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#334155;padding:24px;">
        <div style="background:#ffffff;padding:32px;border-radius:24px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);border:1px solid #E2E8F0;text-align:center;max-width:460px;width:100%;">
          <div style="width:48px;height:48px;background:#EFF6FF;color:#2563EB;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;font-weight:bold;">
            🏥
          </div>
          <h2 style="font-size:18px;font-weight:700;color:#0F172A;margin:0 0 8px 0;">LABVIBHARAM Loading</h2>
          <p id="loader-subtext" style="font-size:13px;color:#64748B;line-height:1.5;margin:0 0 16px 0;">
            Initializing clinical suite and encrypted workspace...
          </p>
          <div style="width:100%;background:#F1F5F9;height:6px;border-radius:999px;overflow:hidden;margin-bottom:16px;">
            <div style="width:60%;background:#2563EB;height:100%;border-radius:999px;animation:pulse 1.5s infinite;"></div>
          </div>

          <!-- Fallback prompt shown if uncompiled source was served by GitHub Pages -->
          <div id="loader-fallback-prompt" style="display:none;text-align:left;background:#FFFBEB;border:1px solid #FCD34D;border-radius:16px;padding:16px;margin-top:16px;font-size:12px;color:#92400E;">
            <div style="font-weight:bold;margin-bottom:6px;display:flex;align-items:center;gap:6px;">
              <span>⚠️</span> GitHub Pages Deployment Notice
            </div>
            <p style="margin:0 0 10px 0;line-height:1.5;">
              GitHub Pages is currently serving the root repository instead of the compiled build.
            </p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <a id="open-docs-btn" href="./docs/" style="display:inline-block;padding:8px 14px;background:#2563EB;color:#ffffff;border-radius:999px;font-weight:bold;text-decoration:none;font-size:11px;">
                Open /docs/ Version
              </a>
              <button onclick="window.location.reload()" style="padding:8px 14px;background:#ffffff;border:1px solid #D1D5DB;color:#374151;border-radius:999px;font-weight:bold;font-size:11px;cursor:pointer;">
                Retry
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Watchdog: If the SPA hasn't mounted in 2.5s (e.g. uncompiled .tsx on GitHub Pages root), auto-route or show prompt
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.querySelector('.initial-loader')) {
          var isGitHub = window.location.hostname.endsWith('github.io');
          if (isGitHub && !window.location.pathname.includes('/docs')) {
            var currentPath = window.location.pathname;
            var target = currentPath.endsWith('/') ? currentPath + 'docs/' : currentPath + '/docs/';
            window.location.replace(target);
            return;
          }
          var fallback = document.getElementById('loader-fallback-prompt');
          if (fallback) fallback.style.display = 'block';
        }
      }, 2500);

      window.addEventListener('error', function(e) {
        var fallback = document.getElementById('loader-fallback-prompt');
        if (fallback) fallback.style.display = 'block';
      }, true);
    </script>
  </body>
</html>
