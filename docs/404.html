<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LABVIBHARAM — Clinical Excellence</title>
    <script>
      var p = window.location.pathname;
      // Do not redirect asset 404s to avoid redirect loops
      if (p.indexOf('/assets/') === -1) {
        var segments = p.split('/').filter(Boolean);
        var base = window.location.origin;
        if (segments.length > 0) {
          if (segments[1] === 'docs') {
            window.location.replace(base + '/' + segments[0] + '/docs/');
          } else {
            window.location.replace(base + '/' + segments[0] + '/');
          }
        } else {
          window.location.replace(base + '/');
        }
      }
    </script>
  </head>
  <body style="font-family:sans-serif;text-align:center;padding:40px;color:#334155;">
    <h2>Page Not Found</h2>
    <p><a href="./" style="color:#2563EB;font-weight:bold;">Return to LABVIBHARAM</a></p>
  </body>
</html>
